<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keller 공연장 카드형 목록</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #202124;
    }
    .hero {
      padding: 56px 24px 36px;
      color: #fff;
      background: radial-gradient(circle at top left, #4f46e5, #111827 55%, #0b0f19);
      text-align: center;
    }
    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: -0.05em;
    }
    .hero p {
      margin: 0;
      color: #d1d5db;
      font-size: 16px;
    }
    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }
    .controls {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 12px;
      margin: 28px auto 16px;
    }
    input, select {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #fff;
      color: #111827;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }
    .summary {
      margin: 0 0 18px;
      color: #6b7280;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 22px;
      padding-bottom: 64px;
    }
    .card {
      overflow: hidden;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 38px rgba(15, 23, 42, 0.13);
    }
    .image-box {
      position: relative;
      height: 180px;
      background: #ffffff;
      border-bottom: 1px solid #f0f0f0;
    }
    .image-box.has-image {
      background: #111827;
    }
    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .station {
      position: absolute;
      left: 14px;
      top: 14px;
      padding: 7px 10px;
      border-radius: 999px;
      color: #fff;
      background: rgba(17, 24, 39, 0.76);
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }
    .body {
      padding: 20px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.04em;
      line-height: 1.25;
    }
    .year {
      margin-top: 5px;
      color: #6b7280;
      font-size: 13px;
    }
    .price {
      flex: 0 0 auto;
      padding: 8px 10px;
      border-radius: 12px;
      background: #111827;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    .meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      margin: 16px 0;
    }
    .meta-item {
      min-height: 58px;
      padding: 10px 11px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid #f1f2f4;
      font-size: 14px;
      line-height: 1.35;
    }
    .label {
      display: block;
      margin-bottom: 4px;
      color: #6b7280;
      font-size: 11px;
      font-weight: 800;
    }
    .map-link {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 800;
    }
    .map-link:hover {
      text-decoration: underline;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 14px 0;
    }
    .chip {
      padding: 6px 9px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 12px;
      font-weight: 700;
    }
    .chip.gray {
      background: #f3f4f6;
      color: #6b7280;
    }
    .note {
      margin: 14px 0 16px;
      color: #4b5563;
      font-size: 13px;
      line-height: 1.6;
      word-break: keep-all;
    }
    .memo {
      margin-top: -6px;
      margin-bottom: 16px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
      word-break: keep-all;
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border-radius: 14px;
      background: #111827;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
    }
    .btn.secondary {
      background: #f3f4f6;
      color: #111827;
    }
    .btn.disabled {
      background: #f3f4f6;
      color: #9ca3af;
      pointer-events: none;
    }
    @media (max-width: 760px) {
      .controls {
        grid-template-columns: 1fr;
      }
      .hero {
        padding-top: 42px;
      }
    }
  </style>
</head>

    const grid = document.getElementById("grid");
    const summary = document.getElementById("summary");
    const searchInput = document.getElementById("searchInput");
    const locationFilter = document.getElementById("locationFilter");
    const sortFilter = document.getElementById("sortFilter");

    function normalize(value) {
      return String(value || "").trim();
    }

    function display(value, fallback = "확인 필요") {
      const text = normalize(value);
      return text ? text : fallback;
    }

    function priceNumber(value) {
      const num = Number(String(value || "").replace(/[^0-9]/g, ""));
      return Number.isFinite(num) ? num : 0;
    }

    function maxNumber(value) {
      const nums = String(value || "").match(/\d+/g);
      if (!nums) return 0;
      return Math.max(...nums.map(Number));
    }

    function formatWon(value) {
      const n = priceNumber(value);
      return n ? n.toLocaleString("ko-KR") + "원" : "확인 필요";
    }

    function makeChips(venue) {
      const chips = [];
      if (venue.multiTrack) chips.push(`멀티트랙 ${venue.multiTrack}`);
      if (venue.filming) chips.push(`촬영 ${venue.filming}`);
      if (venue.projector) chips.push(`빔프로젝터 ${venue.projector}`);
      if (venue.etc) chips.push(venue.etc);
      return chips;
    }

    function renderImage(venue) {
      const image = normalize(venue.image);
      if (!image) {
        return `<div class="image-box"><span class="station">${display(venue.location, "위치 확인")}</span></div>`;
      }
      return `
        <div class="image-box has-image">
          <img src="${image}" alt="${venue.name} 무대 사진" onerror="this.closest('.image-box').classList.remove('has-image'); this.remove();" />
          <span class="station">${display(venue.location, "위치 확인")}</span>
        </div>
      `;
    }

    function render(list) {
      summary.textContent = `총 ${list.length}개 공연장을 표시하고 있습니다.`;
      grid.innerHTML = list.map((venue) => {
        const chips = makeChips(venue);
        const link = normalize(venue.link);
        const equipment = normalize(venue.equipment);
        const mapLink = normalize(venue.mapLink);
        return `
          <article class="card">
            ${renderImage(venue)}
            <div class="body">
              <div class="top">
                <div>
                  <h2>${display(venue.name)}</h2>
                  ${venue.year ? `<div class="year">${venue.year}</div>` : ""}
                </div>
                <div class="price">${formatWon(venue.price)}</div>
              </div>

              <div class="meta">
                <div class="meta-item"><span class="label">위치</span>${mapLink ? `<a class="map-link" href="${mapLink}" target="_blank" rel="noopener noreferrer">${display(venue.location)}</a>` : display(venue.location)}</div>
                <div class="meta-item"><span class="label">대관 시간</span>${display(venue.time)}</div>
                <div class="meta-item"><span class="label">좌석</span>${display(venue.seats)}명</div>
                <div class="meta-item"><span class="label">스탠딩</span>${display(venue.standing)}명</div>
                <div class="meta-item"><span class="label">주류반입</span>${display(venue.alcohol)}</div>
                <div class="meta-item"><span class="label">주차</span>자체 ${display(venue.parking)} · 공영 ${display(venue.publicParking)}</div>
              </div>

              <div class="chips">
                ${chips.length ? chips.map(chip => `<span class="chip">${chip}</span>`).join("") : `<span class="chip gray">추가비용 정보 없음</span>`}
              </div>

              <p class="note">${display(venue.note, "비고 없음")}</p>
              ${venue.memo ? `<p class="memo">메모: ${venue.memo}</p>` : ""}

              <div class="buttons">
                <a class="btn ${link ? "" : "disabled"}" href="${link || "#"} " target="_blank" rel="noopener noreferrer">공식·상세 링크 보기</a>
                ${equipment ? `<a class="btn secondary" href="${equipment}" target="_blank" rel="noopener noreferrer">장비 리스트 보기</a>` : ""}
                ${venue.schedule? venue.scheduleType === "link"? `<a class="btn secondary" href="${venue.schedule}" target="_blank" rel="noopener noreferrer">대관일정 보기</a>`: `<a class="btn secondary" href="tel:${venue.schedule}">전화 문의 ${venue.schedule}</a>`: ""}
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function setLocationOptions() {
      [...new Set(venues.map(v => normalize(v.location)).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, "ko"))
        .forEach(location => {
          const option = document.createElement("option");
          option.value = location;
          option.textContent = location;
          locationFilter.appendChild(option);
        });
    }

    function apply() {
      const keyword = searchInput.value.trim().toLowerCase();
      const selectedLocation = locationFilter.value;
      const sort = sortFilter.value;

      let list = venues.filter(venue => {
        const text = `${venue.name} ${venue.location} ${venue.note} ${venue.memo}`.toLowerCase();
        const keywordOk = !keyword || text.includes(keyword);
        const locationOk = selectedLocation === "all" || normalize(venue.location) === selectedLocation;
        return keywordOk && locationOk;
      });

      if (sort === "priceLow") list = [...list].sort((a, b) => priceNumber(a.price) - priceNumber(b.price));
      if (sort === "priceHigh") list = [...list].sort((a, b) => priceNumber(b.price) - priceNumber(a.price));
      if (sort === "standingHigh") list = [...list].sort((a, b) => maxNumber(b.standing) - maxNumber(a.standing));

      render(list);
    }

    searchInput.addEventListener("input", apply);
    locationFilter.addEventListener("change", apply);
    sortFilter.addEventListener("change", apply);

    setLocationOptions();
    apply();
  </script>
</body>
</html>
